  <script>
    (function () {
      var packs = {"en":{"okTitle":"Email confirmed","okText":"Return to the EASY ESTATE app on your phone. If the app is closed, open it and sign in with your email and password.","errTitle":"The link has expired or has already been used","errText":"If your email is already confirmed, just sign in to the app. If not, open the app and request a new email."},"ru":{"okTitle":"Email подтверждён","okText":"Вернитесь в приложение EASY ESTATE на телефоне. Если приложение закрыто, откройте его и войдите с email и паролем.","errTitle":"Ссылка устарела или уже использована","errText":"Если email уже подтверждён, просто войдите в приложение. Если нет — откройте приложение и запросите новое письмо."},"uz":{"okTitle":"Email tasdiqlandi","okText":"Telefoningizdagi EASY ESTATE ilovasiga qayting. Agar ilova yopiq boʻlsa, uni oching va email hamda parol bilan kiring.","errTitle":"Havola eskirgan yoki allaqachon ishlatilgan","errText":"Agar emailingiz allaqachon tasdiqlangan boʻlsa, ilovaga kiring. Aks holda ilovani oching va yangi xat soʻrang."},"kk":{"okTitle":"Email расталды","okText":"Телефондағы EASY ESTATE қосымшасына оралыңыз. Егер қосымша жабық болса, оны ашып, email мен құпиясөз арқылы кіріңіз.","errTitle":"Сілтеменің мерзімі өтті немесе ол бұрын қолданылған","errText":"Егер email бұрын расталған болса, қосымшаға кіріңіз. Әйтпесе қосымшаны ашып, жаңа хат сұраңыз."},"ky":{"okTitle":"Email ырасталды","okText":"Телефонуңуздагы EASY ESTATE колдонмосуна кайтыңыз. Эгер колдонмо жабык болсо, аны ачып, email жана сырсөз менен кириңиз.","errTitle":"Шилтеменин мөөнөтү бүттү же ал мурун колдонулган","errText":"Эгер email мурун ырасталган болсо, колдонмого кириңиз. Болбосо колдонмону ачып, жаңы кат сураңыз."},"tg":{"okTitle":"Email тасдиқ шуд","okText":"Ба барномаи EASY ESTATE дар телефони худ баргардед. Агар барнома пӯшида бошад, онро кушоед ва бо email ва парол ворид шавед.","errTitle":"Мӯҳлати пайванд гузаштааст ё он аллакай истифода шудааст","errText":"Агар email аллакай тасдиқ шуда бошад, ба барнома ворид шавед. Дар акси ҳол барномаро кушоед ва мактуби навро дархост кунед."},"az":{"okTitle":"E-poçt təsdiqləndi","okText":"Telefonunuzdakı EASY ESTATE tətbiqinə qayıdın. Tətbiq bağlıdırsa, onu açın və e-poçt və şifrə ilə daxil olun.","errTitle":"Linkin müddəti bitib və ya o artıq istifadə olunub","errText":"E-poçtunuz artıq təsdiqlənibsə, sadəcə tətbiqə daxil olun. Əks halda tətbiqi açın və yeni məktub istəyin."},"tr":{"okTitle":"E-posta doğrulandı","okText":"Telefonunuzdaki EASY ESTATE uygulamasına dönün. Uygulama kapalıysa açın ve e-posta ile şifrenizle giriş yapın.","errTitle":"Bağlantının süresi dolmuş veya bağlantı zaten kullanılmış","errText":"E-postanız zaten doğrulandıysa uygulamaya giriş yapın. Doğrulanmadıysa uygulamayı açın ve yeni bir e-posta isteyin."},"uk":{"okTitle":"Email підтверджено","okText":"Поверніться до застосунку EASY ESTATE на телефоні. Якщо застосунок закрито, відкрийте його та увійдіть за допомогою email і пароля.","errTitle":"Посилання застаріло або вже використане","errText":"Якщо email уже підтверджено, просто увійдіть у застосунок. Якщо ні — відкрийте застосунок і запросіть новий лист."},"de":{"okTitle":"E-Mail-Adresse bestätigt","okText":"Kehren Sie zur EASY ESTATE App auf Ihrem Smartphone zurück. Wenn die App geschlossen ist, öffnen Sie sie und melden Sie sich mit E-Mail und Passwort an.","errTitle":"Der Link ist abgelaufen oder wurde bereits verwendet","errText":"Wenn Ihre E-Mail-Adresse bereits bestätigt ist, melden Sie sich einfach in der App an. Andernfalls öffnen Sie die App und fordern Sie eine neue E-Mail an."},"fr":{"okTitle":"Adresse e-mail confirmée","okText":"Revenez dans l'application EASY ESTATE sur votre téléphone. Si l'application est fermée, ouvrez-la et connectez-vous avec votre e-mail et votre mot de passe.","errTitle":"Le lien a expiré ou a déjà été utilisé","errText":"Si votre adresse e-mail est déjà confirmée, connectez-vous simplement à l'application. Sinon, ouvrez l'application et demandez un nouvel e-mail."},"es":{"okTitle":"Correo electrónico confirmado","okText":"Vuelve a la aplicación EASY ESTATE en tu teléfono. Si la aplicación está cerrada, ábrela e inicia sesión con tu correo y contraseña.","errTitle":"El enlace ha caducado o ya se ha utilizado","errText":"Si tu correo ya está confirmado, simplemente inicia sesión en la aplicación. Si no, abre la aplicación y solicita un nuevo correo."},"it":{"okTitle":"Email confermata","okText":"Torna all'app EASY ESTATE sul telefono. Se l'app è chiusa, aprila e accedi con email e password.","errTitle":"Il link è scaduto o è già stato utilizzato","errText":"Se la tua email è già confermata, accedi all'app. Altrimenti apri l'app e richiedi una nuova email."},"pt":{"okTitle":"E-mail confirmado","okText":"Volte ao app EASY ESTATE no seu telefone. Se o app estiver fechado, abra-o e entre com o seu e-mail e senha.","errTitle":"O link expirou ou já foi usado","errText":"Se o seu e-mail já está confirmado, basta entrar no app. Caso contrário, abra o app e peça um novo e-mail."},"pl":{"okTitle":"Adres e-mail potwierdzony","okText":"Wróć do aplikacji EASY ESTATE na telefonie. Jeśli aplikacja jest zamknięta, otwórz ją i zaloguj się adresem e-mail i hasłem.","errTitle":"Link wygasł lub został już użyty","errText":"Jeśli adres e-mail jest już potwierdzony, po prostu zaloguj się w aplikacji. Jeśli nie — otwórz aplikację i poproś o nową wiadomość."},"zh":{"okTitle":"邮箱已确认","okText":"请返回手机上的 EASY ESTATE 应用。如果应用已关闭，请打开应用并使用邮箱和密码登录。","errTitle":"链接已过期或已被使用","errText":"如果您的邮箱已确认，请直接登录应用。否则，请打开应用并重新申请邮件。"},"ja":{"okTitle":"メールアドレスが確認されました","okText":"スマートフォンの EASY ESTATE アプリに戻ってください。アプリが閉じている場合は、アプリを開いてメールアドレスとパスワードでログインしてください。","errTitle":"リンクの有効期限が切れているか、すでに使用されています","errText":"メールアドレスが確認済みの場合は、そのままアプリにログインしてください。未確認の場合は、アプリを開いて新しいメールをリクエストしてください。"},"ko":{"okTitle":"이메일이 인증되었습니다","okText":"휴대폰의 EASY ESTATE 앱으로 돌아가세요. 앱이 닫혀 있다면 앱을 열고 이메일과 비밀번호로 로그인하세요.","errTitle":"링크가 만료되었거나 이미 사용되었습니다","errText":"이메일이 이미 인증되었다면 앱에 로그인하세요. 그렇지 않다면 앱을 열고 새 이메일을 요청하세요."},"hi":{"okTitle":"ईमेल की पुष्टि हो गई","okText":"अपने फ़ोन पर EASY ESTATE ऐप पर लौटें। अगर ऐप बंद है, तो उसे खोलें और ईमेल और पासवर्ड से लॉग इन करें।","errTitle":"लिंक की समय-सीमा समाप्त हो गई है या इसका पहले ही उपयोग हो चुका है","errText":"अगर आपके ईमेल की पुष्टि पहले ही हो चुकी है, तो बस ऐप में लॉग इन करें। अन्यथा ऐप खोलें और नया ईमेल मँगवाएँ।"},"id":{"okTitle":"Email berhasil dikonfirmasi","okText":"Kembali ke aplikasi EASY ESTATE di ponsel Anda. Jika aplikasi tertutup, buka dan masuk dengan email dan kata sandi.","errTitle":"Tautan sudah kedaluwarsa atau sudah digunakan","errText":"Jika email Anda sudah dikonfirmasi, cukup masuk ke aplikasi. Jika belum, buka aplikasi dan minta email baru."},"ms":{"okTitle":"E-mel telah disahkan","okText":"Kembali ke aplikasi EASY ESTATE pada telefon anda. Jika aplikasi ditutup, bukanya dan log masuk dengan e-mel dan kata laluan.","errTitle":"Pautan telah tamat tempoh atau telah digunakan","errText":"Jika e-mel anda telah disahkan, log masuk sahaja ke aplikasi. Jika belum, buka aplikasi dan minta e-mel baharu."},"vi":{"okTitle":"Email đã được xác nhận","okText":"Hãy quay lại ứng dụng EASY ESTATE trên điện thoại. Nếu ứng dụng đang đóng, hãy mở ứng dụng và đăng nhập bằng email và mật khẩu.","errTitle":"Liên kết đã hết hạn hoặc đã được sử dụng","errText":"Nếu email của bạn đã được xác nhận, chỉ cần đăng nhập vào ứng dụng. Nếu chưa, hãy mở ứng dụng và yêu cầu email mới."}};
      var codes = ["en","ru","uz","kk","ky","tg","az","tr","uk","de","fr","es","it","pt","pl","zh","ja","ko","hi","id","ms","vi"];
      var query = new URLSearchParams(window.location.search);
      var hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
      var requested = (query.get('lang') || hash.get('lang') || '').toLowerCase();
      var browser = (navigator.language || '').slice(0, 2).toLowerCase();
      var lang = codes.indexOf(requested) >= 0
        ? requested
        : (codes.indexOf(browser) >= 0 ? browser : 'en');
      var failed = query.has('error') || query.has('error_code') ||
        hash.has('error') || hash.has('error_code');
      var pack = packs[lang];
      document.documentElement.lang = lang;
      document.getElementById('title').textContent = failed ? pack.errTitle : pack.okTitle;
      document.getElementById('text').textContent = failed ? pack.errText : pack.okText;
      document.title = failed ? pack.errTitle : pack.okTitle;
      history.replaceState(null, '', window.location.pathname);
    })();
